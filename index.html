<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Yaneth✨</title>
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background: radial-gradient(ellipse at center, #10102c 0%, #050510 55%, #000 100%);
      color: white; font-family: Georgia, serif;
    }
    #scene { position: fixed; inset: 0; }
    #title {
      position: fixed; top: 5%; left: 50%; transform: translateX(-50%);
      width: 90%; text-align: center; pointer-events: none;
      text-shadow: 0 0 12px #ff8be8, 0 0 28px #9e54ff;
      z-index: 2;
    }
    #title h1 { margin: 0; font-size: clamp(25px, 5vw, 44px); font-style: italic; }
    #title p { margin: 9px 0 0; font-size: clamp(12px, 2.5vw, 17px); color: #ffd9f7; }
    #hint {
      position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      width: max-content; max-width: 92%; text-align: center; font: 12px Arial, sans-serif;
      color: #e4dcff; opacity: .8; z-index: 2; pointer-events: none;
    }
    #controls {
      position: fixed; top: 15px; right: 14px; z-index: 3;
      display: flex; gap: 8px;
    }
    button {
      border: 1px solid #e8aaff88; background: #17102ccc; color: white;
      padding: 10px 13px; border-radius: 20px; font-size: 12px; cursor: pointer;
      box-shadow: 0 0 12px #c44dff33;
    }
    button:hover { background: #4a2060; }
    #message {
      position: fixed; left: 50%; bottom: 58px; transform: translateX(-50%);
      text-align: center; width: 90%; font-size: clamp(16px, 3vw, 23px);
      color: #ffe2fa; text-shadow: 0 0 10px #ff50ca; pointer-events: none; z-index: 2;
    }
  </style>
</head>
<body>
  <div id="scene"></div>
  <div id="title">
    <h1>Te quiero✨</h1>
    <p>Mi universo eres tú ✨</p>
  </div>
  <div id="controls">
    <button id="pause">Pausar giro</button>
    <button id="reset">Reiniciar vista</button>
  </div>
  <div id="message">Eres mi estrella favorita 🌟</div>
  <div id="hint">Arrastra para mirar alrededor · Pellizca o usa la rueda para acercarte</div>

  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
      }
    }
  </script>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const holder = document.getElementById('scene');
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x03030c, 0.012);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 2.5, 17);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    holder.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.045;
    controls.minDistance = 7;
    controls.maxDistance = 30;
    controls.autoRotate = false;

    scene.add(new THREE.AmbientLight(0xffffff, 1.5));
    const glow = new THREE.PointLight(0xff66e8, 45, 35);
    glow.position.set(0, 2, 2);
    scene.add(glow);

    // Fondo de estrellas
    function makeStars(count, radius) {
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);
      const palette = [
        new THREE.Color('#ffffff'), new THREE.Color('#ffb9f4'),
        new THREE.Color('#a8baff'), new THREE.Color('#d8a4ff')
      ];
      for (let i = 0; i < count; i++) {
        const r = radius * (0.25 + Math.random() * 0.75);
        const theta = Math.random() * Math.PI * 2;
        const u = Math.random() * 2 - 1;
        const s = Math.sqrt(1 - u * u);
        positions[i*3] = r * s * Math.cos(theta);
        positions[i*3+1] = r * u;
        positions[i*3+2] = r * s * Math.sin(theta);
        const c = palette[Math.floor(Math.random() * palette.length)];
        colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      const mat = new THREE.PointsMaterial({ size: 0.055, vertexColors: true, transparent: true, opacity: 0.9, sizeAttenuation: true });
      const points = new THREE.Points(geo, mat);
      scene.add(points);
      return points;
    }
    const backgroundStars = makeStars(2600, 90);

    // Grupo principal: corazón de partículas
    const universe = new THREE.Group();
    scene.add(universe);

    function heartPoint(t, scale) {
      // Curva clásica de corazón, con profundidad para que parezca tridimensional
      const x = 16 * Math.pow(Math.sin(t), 3);
      const y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
      return new THREE.Vector3(x * scale / 17, y * scale / 17, 0);
    }

    const heartCount = 6500;
    const heartPositions = new Float32Array(heartCount * 3);
    const heartColors = new Float32Array(heartCount * 3);
    const pink = new THREE.Color('#ff73e6');
    const pale = new THREE.Color('#ffffff');
    const violet = new THREE.Color('#a88bff');
    for (let i = 0; i < heartCount; i++) {
      const t = Math.random() * Math.PI * 2;
      const fill = Math.sqrt(Math.random());
      const p = heartPoint(t, 5.1 * fill);
      p.x += (Math.random() - 0.5) * 0.18;
      p.y += (Math.random() - 0.5) * 0.18;
      p.z = (Math.random() - 0.5) * 1.6 * (0.35 + fill);
      heartPositions[i*3] = p.x;
      heartPositions[i*3+1] = p.y + 1.0;
      heartPositions[i*3+2] = p.z;
      const c = Math.random() > 0.82 ? pale : (Math.random() > 0.5 ? pink : violet);
      heartColors[i*3] = c.r; heartColors[i*3+1] = c.g; heartColors[i*3+2] = c.b;
    }
    const heartGeo = new THREE.BufferGeometry();
    heartGeo.setAttribute('position', new THREE.BufferAttribute(heartPositions, 3));
    heartGeo.setAttribute('color', new THREE.BufferAttribute(heartColors, 3));
    const heartMat = new THREE.PointsMaterial({
      size: 0.045, vertexColors: true, transparent: true, opacity: 0.92,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const heart = new THREE.Points(heartGeo, heartMat);
    universe.add(heart);

    // Galaxia espiral en el centro
    const galaxyCount = 9000;
    const galaxyPositions = new Float32Array(galaxyCount * 3);
    const galaxyColors = new Float32Array(galaxyCount * 3);
    const c1 = new THREE.Color('#ffffff');
    const c2 = new THREE.Color('#79caff');
    const c3 = new THREE.Color('#f5a5ff');
    for (let i = 0; i < galaxyCount; i++) {
      const arm = Math.floor(Math.random() * 3);
      const r = Math.pow(Math.random(), 0.65) * 3.1;
      const angle = r * 1.8 + arm * (Math.PI * 2 / 3) + (Math.random() - 0.5) * 0.5;
      galaxyPositions[i*3] = Math.cos(angle) * r;
      galaxyPositions[i*3+1] = (Math.random() - 0.5) * (0.2 + r * 0.12);
      galaxyPositions[i*3+2] = Math.sin(angle) * r;
      const color = Math.random() > 0.7 ? c3 : (Math.random() > 0.5 ? c2 : c1);
      galaxyColors[i*3] = color.r; galaxyColors[i*3+1] = color.g; galaxyColors[i*3+2] = color.b;
    }
    const galaxyGeo = new THREE.BufferGeometry();
    galaxyGeo.setAttribute('position', new THREE.BufferAttribute(galaxyPositions, 3));
    galaxyGeo.setAttribute('color', new THREE.BufferAttribute(galaxyColors, 3));
    const galaxyMat = new THREE.PointsMaterial({
      size: 0.055, vertexColors: true, transparent: true, opacity: 0.95,
      blending: THREE.AdditiveBlending, depthWrite: false
    });
    const galaxy = new THREE.Points(galaxyGeo, galaxyMat);
    galaxy.position.y = -0.5;
    galaxy.rotation.x = 0.28;
    universe.add(galaxy);

    // Brillo central
    const core = new THREE.Mesh(
      new THREE.SphereGeometry(0.18, 24, 24),
      new THREE.MeshBasicMaterial({ color: 0xffffff })
    );
    core.position.y = -0.48;
    universe.add(core);

    // Mensajes flotantes en pequeñas tarjetas 3D
    function textTexture(text, subtext) {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 220;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = 'rgba(20, 10, 38, 0.72)';
      ctx.strokeStyle = 'rgba(255, 170, 245, 0.85)';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(8, 8, 496, 204, 28);
      ctx.fill(); ctx.stroke();
      ctx.textAlign = 'center';
      ctx.shadowColor = '#ff5de4'; ctx.shadowBlur = 18;
      ctx.fillStyle = '#fff1fc'; ctx.font = 'bold 42px Georgia';
      ctx.fillText(text, 256, 98);
      ctx.shadowBlur = 7;
      ctx.fillStyle = '#e3ccff'; ctx.font = '26px Georgia';
      ctx.fillText(subtext, 256, 150);
      const texture = new THREE.CanvasTexture(canvas);
      texture.colorSpace = THREE.SRGBColorSpace;
      return texture;
    }
    const messages = [
      ['Vales mucho💗', 'No cambies 💗'], [' cuenta  conmigo ✨', 'Gracias x hacer mis dias mas bonitos💗'],
      ['Siempre juntos ♡', 'Nuestro universo'], ['Mi persona favorita', 'Por siempre'],
      ['Eres mi estrella', 'Mi felicidad']
    ];
    const cards = [];
    messages.forEach((m, i) => {
      const texture = textTexture(m[0], m[1]);
      const material = new THREE.MeshBasicMaterial({ map: texture, transparent: true, side: THREE.DoubleSide, depthWrite: false });
      const card = new THREE.Mesh(new THREE.PlaneGeometry(2.7, 1.16), material);
      const a = i / messages.length * Math.PI * 2;
      card.position.set(Math.cos(a) * 6.1, 1 + Math.sin(a * 2) * 1.8, Math.sin(a) * 4.2);
      card.lookAt(0, 0, 0);
      universe.add(card);
      cards.push({ card, a, i });
    });

    let spinning = true;
    document.getElementById('pause').addEventListener('click', (e) => {
      spinning = !spinning;
      e.currentTarget.textContent = spinning ? 'Pausar giro' : 'Continuar giro';
    });
    document.getElementById('reset').addEventListener('click', () => {
      camera.position.set(0, 2.5, 17);
      controls.target.set(0, 0, 0);
      controls.update();
    });

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (spinning) {
        universe.rotation.y += 0.0028;
        heart.rotation.y = Math.sin(t * 0.45) * 0.13;
        galaxy.rotation.y -= 0.006;
        backgroundStars.rotation.y += 0.00012;
        cards.forEach(({card, a, i}) => {
          card.position.x = Math.cos(a + t * 0.16) * 6.1;
          card.position.z = Math.sin(a + t * 0.16) * 4.2;
          card.position.y = 1 + Math.sin(t * 0.7 + i) * 1.3;
          card.lookAt(camera.position);
        });
      }
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    });
  </script>
</body>
</html>
